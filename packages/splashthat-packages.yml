note: >
  Splash publishes NO first-party client SDK in any public registry. The
  official developer surface is a Postman public collection
  (https://api-docs.splashthat.com/) with copy-paste HTTP examples, and API
  credentials are issued by a Customer Success Manager rather than self-serve,
  so there is no distributed client library to version. The SplashThat GitHub
  organization exists and is genuinely theirs (its forks of Symfony bundles
  such as FOSOAuthServerBundle and RMSPushNotificationsBundle match the
  `Splash\APIBundle\Entity\GroupContact` class name that leaks in the API's own
  412 error payload), but every public repository there is a fork of a
  third-party project or an interview/tutorial scaffold — none is a Splash API
  client. Because no OFFICIAL SDK exists, NO `SDKs` pointer is emitted in
  apis.yml; only `Packages`.
