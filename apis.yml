apis:
  - name: Splash API
    description: >
      REST API for the Splash event marketing platform. Enables programmatic
      management of events, guest (GroupContact) records, organization-level
      contacts, unsubscribes, event approval workflows, team management, and
      registration forms, plus event creation through a separate CRM endpoint.
      Authentication uses the OAuth 2.0 resource-owner password grant — a
      Client ID, Client Secret, username and password are exchanged for a
      bearer token at /oauth/v2/token with scope "user". Credentials are issued
      manually by the Splash Customer Success team; there is no self-serve
      signup. The published machine-readable contract is a Postman collection
      ("Splash API v2.2"), not an OpenAPI.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://api-docs.splashthat.com/
